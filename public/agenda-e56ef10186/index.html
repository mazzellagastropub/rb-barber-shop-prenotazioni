<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Foto agenda – RB</title>
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0b0a;--card:#181614;--line:#2c2824;--line-2:#3a352f;--text:#f3eee6;--text-2:#b9b1a5;--muted:#7d7569;--brass:#c9a96b;--brass-2:#e2c88f;--on-brass:#16120c;--warn:#2a2213;--warn-line:#a9864a;--ok:#8fcf9f;--err:#e07a6f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;background:radial-gradient(120% 50% at 50% -10%,#2a221a 0%,rgba(12,11,10,0) 60%),var(--bg)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px calc(32px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:14px;padding:calc(22px + env(safe-area-inset-top)) 0 18px}
  header img{width:56px;height:56px;filter:invert(1);mix-blend-mode:screen}
  h1{font:600 22px/1.2 Cinzel,serif;letter-spacing:.03em;margin:0}
  .sub{color:var(--text-2);font-size:14px;margin:2px 0 0}
  .btn{display:block;width:100%;appearance:none;border:0;border-radius:16px;background:linear-gradient(180deg,var(--brass-2),var(--brass));color:var(--on-brass);font:700 17px Manrope,sans-serif;padding:18px;cursor:pointer;text-align:center;box-shadow:0 10px 30px -12px rgba(201,169,107,.55)}
  .btn:disabled{opacity:.5}
  .btn.sec{background:transparent;color:var(--text);border:1px solid var(--line-2);box-shadow:none;font-size:15px;padding:14px;margin-top:12px}
  .info{color:var(--text-2);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
  .info b{color:var(--brass-2)}
  .riga{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
  .riga.dubbio{background:var(--warn);border-color:var(--warn-line)}
  .riga.via{opacity:.35}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  input,select{width:100%;font:16px Manrope,sans-serif;border:1px solid var(--line);border-radius:12px;padding:11px;background:#110f0e;color:var(--text);color-scheme:dark}
  input:focus,select:focus{outline:none;border-color:var(--brass)}
  .piede{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--brass-2)}
  .x{appearance:none;border:0;background:none;color:var(--err);font:500 14px Manrope,sans-serif;cursor:pointer;padding:4px}
  .esito{font-size:14px;font-weight:700;margin-top:6px}
  .esito.ok{color:var(--ok)} .esito.no{color:var(--err)} .esito.skip{color:var(--text-2)}
  .err{color:var(--err);font-size:14px}
  .hidden{display:none!important}
  .anteprima{width:100%;border-radius:14px;margin:14px 0;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.jpg" alt="">
    <div><h1>Foto agenda</h1><p class="sub">Gli appuntamenti finiscono su Google Calendar</p></div>
  </header>

  <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
  <button class="btn" id="scatta" type="button">📷 Fotografa l'agenda</button>
  <p class="info" id="aiuto">Inquadra bene la pagina, con la data in alto visibile. Dopo controlli tu l'elenco prima di salvare.</p>
  <img id="anteprima" class="anteprima hidden" alt="Foto dell'agenda">
  <p class="err" id="errore" role="alert"></p>

  <section id="lista" class="hidden">
    <p class="info">Controlla e correggi. Le righe <b>evidenziate</b> sono poco leggibili: verificale bene.</p>
    <div id="righe"></div>
    <button class="btn" id="salva" type="button">Aggiungi al calendario</button>
    <button class="btn sec" type="button" onclick="location.reload()">Ricomincia</button>
  </section>
</div>

<script>
const CODICE = "e56ef10186";
const SERVIZI = [["taglio","Taglio"],["barba","Barba"],["taglio-barba","Taglio + barba"]];
const $ = (id) => document.getElementById(id);
let righe = [];

$("scatta").onclick = () => $("file").click();

function riduci(file) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = ko;
    img.src = URL.createObjectURL(file);
  });
}

$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  $("errore").textContent = "";
  const btn = $("scatta"); btn.disabled = true; btn.textContent = "Sto leggendo l'agenda…";
  try {
    const dataUrl = await riduci(f);
    $("anteprima").src = dataUrl; $("anteprima").classList.remove("hidden");
    const r = await fetch("/api/leggi-agenda", { method: "POST", headers: { "content-type": "application/json", "x-codice": CODICE },
      body: JSON.stringify({ immagine: dataUrl.split(",")[1] }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.errore || "Errore");
    righe = j.appuntamenti.map(a => ({ ...a, tieni: true }));
    if (!righe.length) throw new Error("Non ho trovato appuntamenti in questa foto. Prova con una foto più nitida.");
    disegna();
    $("lista").classList.remove("hidden"); $("aiuto").classList.add("hidden");
    btn.textContent = "📷 Rifai la foto";
  } catch (err) {
    $("errore").textContent = err.message || "Qualcosa non ha funzionato, riprova.";
    btn.textContent = "📷 Fotografa l'agenda";
  } finally { btn.disabled = false; e.target.value = ""; }
};

function disegna() {
  const box = $("righe"); box.innerHTML = "";
  righe.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "riga" + (a.dubbio ? " dubbio" : "") + (a.tieni ? "" : " via");
    d.innerHTML = `
      <div class="g2"><input type="date" value="${a.data}" aria-label="Data"><input type="time" value="${a.ora}" step="1800" aria-label="Ora"></div>
      <div class="g2"><input type="text" value="" aria-label="Nome" placeholder="Nome"><select aria-label="Servizio">${SERVIZI.map(([v,t]) => `<option value="${v}" ${v===a.servizio?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="piede"><span>${a.dubbio ? "Da verificare" : ""}</span><button class="x" type="button">${a.tieni ? "Togli" : "Rimetti"}</button></div>
      ${a.esito ? `<div class="esito ${a.esito==="aggiunto"?"ok":a.esito.startsWith("già")?"skip":"no"}">${a.esito==="aggiunto"?"✓ Aggiunto":a.esito}</div>` : ""}`;
    const [data, ora, nome, serv] = d.querySelectorAll("input,select");
    nome.value = a.nome;
    data.onchange = () => a.data = data.value;
    ora.onchange = () => a.ora = ora.value;
    nome.oninput = () => a.nome = nome.value;
    serv.onchange = () => a.servizio = serv.value;
    d.querySelector(".x").onclick = () => { a.tieni = !a.tieni; disegna(); };
    box.appendChild(d);
  });
}

$("salva").onclick = async () => {
  const daSalvare = righe.filter(a => a.tieni && !a.esito);
  if (!daSalvare.length) { $("errore").textContent = "Niente di nuovo da aggiungere."; return; }
  const btn = $("salva"); btn.disabled = true; btn.textContent = "Salvataggio…"; $("errore").textContent = "";
  try {
    const r = await fetch("/api/aggiungi-appuntamenti", { method: "POST", headers: { "content-type": "application/json", "x-codice": CODICE },
      body: JSON.stringify({ appuntamenti: daSalvare.map(({ data, ora, nome, servizio }) => ({ data, ora, nome, servizio })) }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.errore || "Errore");
    j.risultati.forEach((res, k) => { daSalvare[k].esito = res.esito; });
    disegna();
    const n = j.risultati.filter(x => x.esito === "aggiunto").length;
    btn.textContent = n ? `Fatto: ${n} aggiunti` : "Nessuno aggiunto";
  } catch (err) {
    $("errore").textContent = err.message || "Salvataggio non riuscito, riprova.";
    btn.disabled = false; btn.textContent = "Aggiungi al calendario";
  }
};
</script>
</body>
</html>
